name: SuperLive Recorder
on:
  workflow_dispatch:
    inputs:
      test_url:
        description: "Livestream URL"
        required: true
        type: string
      duration_minutes:
        description: "Recording duration in minutes"
        required: false
        default: "5"
        type: string

jobs:
  record-test:
    name: Record livestream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies (FFmpeg + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Prepare directories
        run: |
          mkdir -p recordings
          mkdir -p recordings/_temp

      - name: Start recording (with Virtual Display)
        env:
          RECORD_URL: ${{ inputs.test_url }}
          RECORDINGS_DIR: ./recordings
          SEGMENT_SECONDS: 60
          VIDEO_BITRATE: 4000000
          AUDIO_BITRATE: 128000
          PAGE_TIMEOUT_MS: 60000
          VIDEO_WAIT_SECONDS: 120
          FIRST_CHUNK_TIMEOUT_SECONDS: 20
          MAX_CANDIDATES: 8
        run: |
          DURATION_SECONDS=$(( ${{ inputs.duration_minutes }} * 60 ))
          export RECORD_DURATION_SECONDS="$DURATION_SECONDS"
          echo "========================================"
          echo "SUPERLIVE RECORDER (XVFB EDITION)"
          echo "========================================"
          echo "URL: ${RECORD_URL}"
          echo "Duration: ${DURATION_SECONDS}s"
          echo "========================================"
          
          # xvfb-run creates a virtual screen so headless=False works perfectly!
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python record_once.py
          
          exit $?

      - name: Upload recordings and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superlive-recordings
          path: |
            recordings/*.mp4
            recordings/_temp/*
            recordings/_diagnostic.png
          if-no-files-found: warn
          retention-days: 7
