name: SuperLive Recorder
on:
  workflow_dispatch:
    inputs:
      test_url:
        description: "Livestream URL"
        required: true
        type: string
      stream_id:
        description: "Stream ID"
        required: false
        default: ""
        type: string
  
  repository_dispatch:
    types: [record_stream]

env:
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

jobs:
  record-test:
    name: Record livestream
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CRITICAL SPEEDUP 1: Cache Python dependencies
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # CRITICAL SPEEDUP 2: Cache Playwright browser
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-120
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Only install Playwright if not cached
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: Prepare directories
        run: |
          mkdir -p recordings
          mkdir -p recordings/_temp

      - name: Start recording (FAST MODE)
        env:
          RECORD_URL: ${{ github.event.client_payload.stream_url || inputs.test_url }}
          RECORDINGS_DIR: ./recordings
          TEMP_DIR: ./recordings/_temp
          VIDEO_BITRATE: 8000000
          AUDIO_BITRATE: 192000
          PAGE_TIMEOUT_MS: 30000
          VIDEO_WAIT_SECONDS: 60
          FIRST_CHUNK_TIMEOUT_SECONDS: 10
          STREAM_ID: ${{ github.event.client_payload.stream_id || inputs.stream_id }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================"
          echo "SUPERLIVE RECORDER (FAST MODE)"
          echo "========================================"
          echo "URL: ${RECORD_URL}"
          echo "Stream ID: ${STREAM_ID}"
          echo "Mode: Fast + Streaming"
          echo "========================================"
          
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python record_once.py
          exit $?

      - name: Upload artifacts (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superlive-recordings-${{ github.run_id }}
          path: |
            recordings/*.mp4
            recordings/_temp/*.png
          if-no-files-found: warn
          retention-days: 3
