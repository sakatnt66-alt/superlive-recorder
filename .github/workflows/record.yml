name: SuperLive Recorder

on:
  workflow_dispatch:
    inputs:
      test_url:
        description: "Livestream URL"
        required: true
        type: string
      duration_minutes:
        description: "Recording duration in minutes"
        required: false
        default: "5"
        type: string

jobs:
  record-test:
    name: Record livestream test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Check environment
        run: |
          echo "Python:"
          python --version

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1

          echo "Playwright:"
          playwright --version

      - name: Check Python syntax
        run: |
          python -m py_compile record_once.py

      - name: Prepare recordings directory
        run: |
          mkdir -p recordings
          mkdir -p recordings/_temp

      - name: Start recording
        env:
          RECORDINGS_DIR: ./recordings
          SEGMENT_SECONDS: 90
          VIDEO_BITRATE: 4000000
          AUDIO_BITRATE: 128000
        run: |
          DURATION_SECONDS=$(( ${{ inputs.duration_minutes }} * 60 ))

          echo "========================================"
          echo "SuperLive Recorder"
          echo "URL: ${{ inputs.test_url }}"
          echo "Duration: ${{ inputs.duration_minutes }} minutes"
          echo "Duration: ${DURATION_SECONDS} seconds"
          echo "========================================"

          export RECORD_DURATION_SECONDS="$DURATION_SECONDS"

          python record_once.py "${{ inputs.test_url }}" &
          RECORDER_PID=$!

          while kill -0 "$RECORDER_PID" 2>/dev/null; do
            echo "Recorder is running..."
            sleep 10
          done

          wait "$RECORDER_PID"
          RECORDER_EXIT_CODE=$?

          echo "Recorder exit code: $RECORDER_EXIT_CODE"

          exit "$RECORDER_EXIT_CODE"

      - name: List recordings
        if: always()
        run: |
          echo "========================================"
          echo "Recordings:"
          echo "========================================"

          find recordings -maxdepth 1 -type f -name "*.mp4" -print -exec ls -lh {} \; || true

      - name: Validate MP4 files
        if: always()
        run: |
          FOUND=0

          for file in recordings/*.mp4; do
            if [ -f "$file" ]; then
              FOUND=1

              echo "----------------------------------------"
              echo "Checking: $file"

              ffprobe \
                -v error \
                -show_entries format=duration,size,format_name \
                -of default=noprint_wrappers=1 \
                "$file"
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "No MP4 recordings were produced."
            exit 1
          fi

      - name: Upload recordings as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superlive-test-recordings
          path: recordings/*.mp4
          if-no-files-found: warn
          retention-days: 7
