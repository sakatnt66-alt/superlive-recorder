name: SuperLive Recorder

on:
  workflow_dispatch:
    inputs:
      test_url:
        description: "Livestream URL for testing"
        required: true
        type: string

jobs:
  test-recorder:
    name: Test recorder environment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Check FFmpeg
        run: |
          ffmpeg -version

      - name: Check FFprobe
        run: |
          ffprobe -version

      - name: Check Playwright
        run: |
          python -c "import playwright; print('Playwright OK')"

      - name: Check recorder file
        run: |
          python -m py_compile record_once.py

      - name: Environment test complete
        run: |
          echo "========================================"
          echo "Environment test completed successfully."
          echo "The livestream URL was received."
          echo "========================================"
