name: SuperLive Recorder

on:
  workflow_dispatch:
    inputs:
      test_url:
        description: "Livestream URL"
        required: true
        type: string

      duration_minutes:
        description: "Recording duration in minutes"
        required: false
        default: "5"
        type: string

jobs:
  record-test:
    name: Record livestream test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Check environment
        run: |
          echo "Python:"
          python --version

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1

          echo "Playwright:"
          python -c "import playwright; print('Playwright OK')"

      - name: Check recorder syntax
        run: |
          python -m py_compile record_once.py

      - name: Prepare recording directories
        run: |
          mkdir -p recordings
          mkdir -p recordings/_temp

      - name: Start recording
        env:
          RECORDINGS_DIR: ./recordings
          SEGMENT_SECONDS: "90"
          VIDEO_BITRATE: "4000000"
          AUDIO_BITRATE: "128000"
        run: |
          echo "========================================"
          echo "Starting livestream recording"
          echo "Duration requested: ${{ inputs.duration_minutes }} minutes"
          echo "========================================"

          python record_once.py "${{ inputs.test_url }}" &
          RECORDER_PID=$!

          echo "Recorder PID: $RECORDER_PID"

          DURATION_SECONDS=$(( ${{ inputs.duration_minutes }} * 60 ))

          echo "Waiting ${DURATION_SECONDS} seconds..."

          sleep "$DURATION_SECONDS"

          echo "========================================"
          echo "Recording test duration reached."
          echo "Requesting graceful stop..."
          echo "========================================"

          kill -INT "$RECORDER_PID" || true

          # Give the recorder time to finalize MediaRecorder and FFmpeg.
          for i in {1..30}; do
            if ! kill -0 "$RECORDER_PID" 2>/dev/null; then
              echo "Recorder stopped successfully."
              break
            fi

            echo "Waiting for recorder to finish... $i/30"
            sleep 1
          done

          # Safety fallback.
          if kill -0 "$RECORDER_PID" 2>/dev/null; then
            echo "Recorder did not stop gracefully."
            echo "Sending TERM..."
            kill -TERM "$RECORDER_PID" || true
            sleep 5
          fi

          wait "$RECORDER_PID" || true

      - name: List recordings
        if: always()
        run: |
          echo "========================================"
          echo "Recording files"
          echo "========================================"

          find recordings -type f -printf '%p | %s bytes\n' \
            | sort || true

      - name: Validate MP4 files
        if: always()
        run: |
          echo "========================================"
          echo "Validating MP4 files"
          echo "========================================"

          shopt -s nullglob

          files=(recordings/*.mp4)

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No MP4 files were produced."
            exit 1
          fi

          for file in "${files[@]}"; do
            echo ""
            echo "Checking: $file"

            ffprobe \
              -v error \
              -show_entries format=duration,size,format_name \
              -show_entries stream=index,codec_type,codec_name,width,height \
              -of json \
              "$file"
          done

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superlive-test-recordings
          path: recordings/*.mp4
          if-no-files-found: warn
          retention-days: 7
