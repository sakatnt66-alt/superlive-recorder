name: SuperLive Recorder

on:
  workflow_dispatch:
    inputs:
      test_url:
        description: "Livestream URL"
        required: true
        type: string
      stream_id:
        description: "Stream ID"
        required: false
        default: ""
        type: string

  repository_dispatch:
    types: [record_stream]

env:
  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

jobs:
  record-test:
    name: Record livestream
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-120
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install --with-deps chromium

      - name: Prepare directories
        run: |
          mkdir -p recordings
          mkdir -p recordings/_temp
          mkdir -p recordings/_preserved
          mkdir -p recordings/_state

      - name: Start recording (FAST MODE)
        env:
          RECORD_URL: ${{ github.event.client_payload.stream_url || inputs.test_url }}
          RECORDINGS_DIR: ./recordings
          TEMP_DIR: ./recordings/_temp
          VIDEO_BITRATE: 8000000
          AUDIO_BITRATE: 192000
          PAGE_TIMEOUT_MS: 30000
          VIDEO_WAIT_SECONDS: 60
          FIRST_CHUNK_TIMEOUT_SECONDS: 10
          STREAM_ID: ${{ github.event.client_payload.stream_id || inputs.stream_id }}
          STREAM_NAME: ${{ github.event.client_payload.stream_name || '' }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_API_URL: ${{ secrets.WORKER_API_URL }}
          AUTO_API_TOKEN: ${{ secrets.AUTO_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================"
          echo "SUPERLIVE RECORDER (FAST MODE)"
          echo "========================================"
          echo "URL: ${RECORD_URL}"
          echo "Stream ID: ${STREAM_ID}"
          echo "Stream Name: ${STREAM_NAME}"
          echo "Mode: Fast + Streaming"
          echo "========================================"
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python record_launcher.py
          exit $?

      - name: Post-process recordings
        if: always()
        env:
          RECORDINGS_DIR: ./recordings
          STREAM_ID: ${{ github.event.client_payload.stream_id || inputs.stream_id }}
          STREAM_NAME: ${{ github.event.client_payload.stream_name || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "========================================"
          echo "POST-PROCESSING PIPELINE"
          echo "========================================"
          echo "Searching in:"
          ls -la recordings/ 2>/dev/null || echo "  recordings/ empty"
          ls -la recordings/_temp/ 2>/dev/null || echo "  _temp/ empty"
          ls -la recordings/_preserved/ 2>/dev/null || echo "  _preserved/ empty"
          python postprocess_recording.py

      - name: Finalize Worker State (Always)
        if: always()
        env:
          STREAM_ID: ${{ github.event.client_payload.stream_id || inputs.stream_id }}
          WORKER_API_URL: ${{ secrets.WORKER_API_URL }}
          AUTO_API_TOKEN: ${{ secrets.AUTO_API_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python -c "
          import os, urllib.request, json, datetime
          stream_id = os.environ.get('STREAM_ID')
          worker_url = os.environ.get('WORKER_API_URL')
          token = os.environ.get('AUTO_API_TOKEN')
          status = os.environ.get('JOB_STATUS')
          if not stream_id or not worker_url or not token: exit(0)
          state = {'stopped_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          if status == 'success': state['status'] = 'completed'
          elif status == 'failure': state['status'] = 'failed'
          else: state['status'] = 'stopped'
          req = urllib.request.Request(f'{worker_url}/api/update-state/{stream_id}', data=json.dumps(state).encode(), headers={'X-Auto-Token': token, 'Content-Type': 'application/json'})
          try: urllib.request.urlopen(req, timeout=15)
          except: pass
          "

      - name: Upload artifacts (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superlive-recordings-${{ github.run_id }}
          path: |
            recordings/*.mp4
            recordings/*.mkv
            recordings/*_preview.jpg
            recordings/_preserved/*.mkv
            recordings/_preserved/*.mp4
            recordings/_preserved/*_preview.jpg
            recordings/_state/*.json
            recordings/_temp/*.png
          if-no-files-found: warn
          retention-days: 3
