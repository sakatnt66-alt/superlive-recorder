name: Auto Monitor

on:
  repository_dispatch:
    types: [auto_monitor]
  schedule:
    # تشغيل تلقائي كل 3 دقائق (بتوقيت UTC)
    - cron: '*/3 * * * *'
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────
# سياسة التزامن:
#   • مجموعة واحدة ثابتة لكل الفرع → لا تشغيلين متزامنين أبدًا
#   • cancel-in-progress: false → التشغيل الجاري لا يُلغى أبدًا
#   • التشغيل الجديد ينتظر حتى يكتمل الحالي
#
# قيد المنصة: إذا وصل تشغيل ثالث بينما هناك تشغيل يعمل + آخر
# ينتظر، يُلغى المنتظر الأقدم. هذا قيد في GitHub Actions وليس
# خطأً في الإعداد. بما أن التشغيل يكتمل عادةً في أقل من 3 دقائق،
# فلا يحدث تراكم فعلي في الظروف العادية.
# ─────────────────────────────────────────────────────────────
concurrency:
  group: auto-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # حد أقصى 5 دقائق — يضمن عدم استمرار التشغيل لفترة طويلة
    # مما يمنع تراكم الطلبات المنتظرة
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run Auto Monitor
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_API_URL: ${{ secrets.WORKER_API_URL }}
          AUTO_API_TOKEN: ${{ secrets.AUTO_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "[AUTO] Starting Auto Monitor workflow"
          echo "[AUTO] Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "[AUTO] Concurrency policy: sequential (wait for previous)"
          python auto_monitor.py
          echo "[AUTO] Auto Monitor completed"
