name: Auto Monitor

on:
  repository_dispatch:
    types: [auto_monitor]
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

# منع التشغيل المتزامن - ينتظر حتى يكتمل السابق
concurrency:
  group: auto-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium
      
      - name: Run Auto Monitor
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_API_URL: ${{ secrets.WORKER_API_URL }}
          AUTO_API_TOKEN: ${{ secrets.AUTO_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "[AUTO] Starting Auto Monitor workflow"
          python auto_monitor.py
