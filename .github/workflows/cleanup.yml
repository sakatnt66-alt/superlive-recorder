name: Cleanup Stuck Recordings

on:
  schedule:
    - cron: '*/5 * * * *'  # يعمل تلقائياً كل 5 دقائق
  workflow_dispatch:       # يمكن تشغيله يدوياً من تبويب Actions

# ⚠️ هذا السطر هو الحل السحري لمشكلة 403: يمنح الصلاحية للكتابة
permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run Cleanup Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python cleanup_recordings.py
